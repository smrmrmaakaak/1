<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별을 따다 - 인터랙티브 악보 & 연주기</title>

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --accent: #F59E0B;
      --bg: #0F172A;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .header-left h1 {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 24px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      padding: 3px 8px;
      border-radius: 20px;
      color: #fff;
      font-family: 'Pretendard', sans-serif;
    }
    .header-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }
    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .container {
      max-width: 1240px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }
    .sheet-card {
      background: #FFFFFF;
      color: #1E293B;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      overflow-x: auto;
      min-height: 800px;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .section-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #CBD5E1;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      display: block;
      transition: all 0.15s;
    }
    .section-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366F1;
      color: #FFFFFF;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-weight: 600; color: #F1F5F9; }
    
    #audio-controls {
      margin-top: 14px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
    }
    
    /* Playback Active Highlight */
    .abcjs-highlight {
      fill: #4F46E5 !important;
      stroke: #4F46E5 !important;
    }
    .abcjs-cursor {
      stroke: #EF4444;
      stroke-width: 2.5;
    }
    
    @media print {
      header, .sidebar, .controls { display: none !important; }
      body { background: white; color: black; padding: 0; }
      .container { display: block; max-width: 100%; margin: 0; padding: 0; }
      .sheet-card { box-shadow: none; padding: 0; border-radius: 0; }
    }
  </style>
</head>

  <header>

    </div>
    <div class="controls">
      <button id="btnPlay" onclick="togglePlay()">▶ 실시간 연주</button>
      <button class="secondary" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
    </div>
  </header>

    <main class="sheet-card" id="sheetContainer">

    </main>

    <aside class="sidebar">
      <div class="panel">
        <h3>📍 곡 구간 바로가기</h3>
        <div class="section-btn-grid">
          <button class="section-btn" onclick="seekToMeasure(1)">🎹 Intro (1마디)</button>
          <button class="section-btn" onclick="seekToMeasure(9)">⭐ Chorus 1 (9마디)</button>

      <div class="panel">

        <div class="stat-row">
          <span class="stat-label">총 마디 수</span>

        <div class="stat-row">
          <span class="stat-label">악기 구성</span>
          <span class="stat-val">Vocal + Piano Grand Staff</span>
        </div>
      </div>

      <div class="panel">
        <h3>💾 파일 다운로드</h3>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <a href="별을_따다.mid" download style="text-decoration:none;">

          </a>
        </div>
      </div>
    </aside>
  </div>

    let visualObj;
    let synthControl;

    function renderScore() {
      visualObj = ABCJS.renderAbc("paper", abcString, {
        responsive: "resize",
        scale: 1.05,
        staffwidth: 820,
        wrap: { minSpacing: 1.8, maxSpacing: 2.8, preferredMeasuresPerLine: 4 },
        add_classes: true
      })[0];

      if (ABCJS.synth.supportsAudio()) {
        synthControl = new ABCJS.synth.SynthController();
        synthControl.load("#midi-player", null, {
          displayLoop: false,
          displayRestart: true,
          displayPlay: true,
          displayProgress: true,
          displayWarp: true
        });

        const createSynth = new ABCJS.synth.CreateSynth();
        createSynth.init({ visualObj: visualObj }).then(() => {
          synthControl.setTune(visualObj, false, { chordsOff: false }).then(() => {
            console.log("Audio ready!");
          });
        });
      }
    }

    function togglePlay() {
      const playBtn = document.querySelector(".abcjs-midi-start");
      if (playBtn) {
        playBtn.click();
      }
    }

    function seekToMeasure(mNum) {
      const el = document.querySelector(`.abcjs-m${mNum - 1}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.fill = '#4F46E5';
        setTimeout(() => el.style.fill = '', 1500);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderScore();
    });
  </script>
