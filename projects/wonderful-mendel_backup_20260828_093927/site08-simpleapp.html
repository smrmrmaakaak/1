<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목수의 홈케어마스터 | 8. 토스형 1초 사진 진단 에디션</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <style>
    * { word-break: keep-all; }
    body {
      background-color: #F2F4F6;
      color: #191F28;
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="selection:bg-blue-200">

  <header class="max-w-md mx-auto px-5 py-4 flex items-center justify-between">
    <span class="font-black text-lg text-slate-900">홈케어마스터</span>
    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">조인형 목수 직영</span>
  </header>

  <main class="max-w-md mx-auto px-5 pt-8 pb-28 space-y-6">
    
    <div class="space-y-2">
      <h1 class="text-2xl font-black text-slate-900 leading-tight">
        사진 1장으로<br>10분 만에 견적 받기
      </h1>
      <p class="text-xs text-slate-500 font-medium">
        30년 목수가 직접 확인하고 정직한 금액을 알려드려요.
      </p>
    </div>

    <!-- 간편 카드 3종 -->
    <div class="space-y-3" id="app-cards">
      
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-2">
        <div class="flex justify-between items-center text-xs text-slate-400">
          <span class="font-bold text-slate-900">1. 어디를 수리하고 싶으신가요?</span>
          <span class="text-blue-600 font-bold">선택완료</span>
        </div>
        <select id="toss-service" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold text-slate-800">
          <option>사각싱크볼 교체 & 상판 재단</option>
          <option>방문/욕실문 수리 및 교체</option>
          <option>아트월 철거 & 벽면 평탄화</option>
          <option>인테리어 필름 랩핑</option>
        </select>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-2">
        <span class="text-xs font-bold text-slate-900 block">2. 출장 희망 지역</span>
        <input type="text" id="toss-loc" placeholder="예: 서울 구로구, 인천 부평, 일산 등" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-800 focus:outline-none focus:border-blue-500">
      </div>

    </div>

    <!-- 실제 시공 실적 간단 미리보기 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center text-xs font-bold">
        <span>최근 해결 사례 (부평)</span>
        <span class="text-emerald-600">400만원 공사비 절감</span>
      </div>
      <div class="aspect-video rounded-xl overflow-hidden bg-slate-100">
        <img src="assets/images/sink_bellago/photo_6.jpg" alt="시공 사례" class="w-full h-full object-cover">
      </div>
      <p class="text-[11px] text-slate-500">타 업체에서 포기한 원목 상판을 30mm 정밀 가공으로 완벽 안착했습니다.</p>
    </div>

  </main>

  <!-- 하단 고정 액션 바 -->
  <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-4 shadow-xl z-40">
    <div class="max-w-md mx-auto flex gap-2">
      <a href="tel:010-9276-4245" class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center text-slate-700 text-base shrink-0">
        <i class="fa-solid fa-phone"></i>
      </a>
      <button onclick="sendTossSMS()" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-2xl shadow-lg transition">
        문자로 사진 보내기 (010-9276-4245)
      </button>
    </div>
  </div>

  <script src="switcher.js"></script>
  <script>
    function sendTossSMS() {
      const s = document.getElementById('toss-service').value;
      const l = document.getElementById('toss-loc').value.trim() || '미입력';
      const msg = `[목수의 홈케어마스터 간편 견적]\n\n1. 희망 시공: ${s}\n2. 지역: ${l}\n\n※ 현장 사진 2~3장을 첨부하여 보내주시면 10분 내로 안내해 드립니다.`;
      const phone = '010-9276-4245';
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
      } else {
        navigator.clipboard.writeText(msg).then(() => {
          alert(`[문자 내용이 복사되었습니다]\n\n받는 사람: ${phone}\n\n붙여넣기 후 사진과 함께 문자를 보내주세요.`);
          window.location.href = `tel:${phone}`;
        });
      }
    }
  </script>
</body>
</html>
