<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라벨르지안 앤틱 명품관 360° 실사 3D 턴테이블 & 홀로그램 뮤지엄</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #07090e;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --panel-border: rgba(255, 255, 255, 0.12);
            --accent-primary: #3b82f6;
            --accent-prugio: #006654;
            --accent-antique: #c2410c;
            --accent-gold: #d97706;
            --accent-holo: #8b5cf6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Top Header Bar */
        .header-bar {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 100;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        .model-switcher {
            display: flex;
            background: #f1f5f9;
            padding: 3px;
            border-radius: 12px;
            gap: 3px;
        }

        .model-pill {
            border: none;
            background: transparent;
            padding: 6px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .model-pill:hover {
            color: #0f172a;
        }

        .model-pill.active-prugio {
            background: #006654;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 102, 84, 0.35);
        }

        .model-pill.active-antique {
            background: linear-gradient(135deg, #c2410c, #ea580c);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(194, 65, 12, 0.4);
        }

        .header-title h1 {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.3px;
        }

        .header-title p {
            font-size: 10.5px;
            color: var(--text-muted);
        }

        /* Category Filter Tabs Bar */
        .category-bar {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5px 8px;
            border-radius: 14px;
            display: flex;
            gap: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            max-width: calc(100vw - 450px);
            overflow-x: auto;
        }
        .category-bar::-webkit-scrollbar {
            height: 4px;
        }
        .category-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .cat-pill {
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            padding: 5px 11px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }
        .cat-pill:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
        }
        .cat-pill.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        /* Antique Items Scroll Bar */
        .items-bar {
            position: absolute;
            top: 116px;
            left: 20px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 4px 8px;
            border-radius: 12px;
            display: flex;
            gap: 5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            max-width: calc(100vw - 450px);
            overflow-x: auto;
        }
        .items-bar::-webkit-scrollbar {
            height: 4px;
        }
        .items-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .col-pill {
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .col-pill:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }
        .col-pill.active {
            background: linear-gradient(135deg, #d97706, #ea580c);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
            font-weight: 700;
        }

        /* Top Center Mode Bar */
        .top-center-bar {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            padding: 5px 8px;
            border-radius: 16px;
            display: flex;
            gap: 4px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .mode-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 7px 13px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .mode-btn:hover {
            color: var(--text-dark);
            background: rgba(0, 0, 0, 0.05);
        }
        .mode-btn.active {
            background: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
        }

        /* 360 Drag Guide Overlay Hint */
        .drag-guide-hint {
            position: absolute;
            top: 160px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: opacity 0.3s ease;
        }

        /* 3D Canvas Viewport */
        #viewport {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
            cursor: grab;
        }
        #viewport:active {
            cursor: grabbing;
        }

        /* Right Detail Inspector Panel */
        .info-panel {
            position: absolute;
            top: 16px;
            right: 20px;
            bottom: 20px;
            width: 410px;
            background: var(--panel-bg);
            backdrop-filter: blur(28px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 22px;
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: -15px 0 45px rgba(0,0,0,0.25);
            overflow-y: auto;
        }
        .info-panel::-webkit-scrollbar {
            width: 5px;
        }
        .info-panel::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .section-title {
            font-size: 12.5px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .highlight-card {
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 12px;
            line-height: 1.55;
        }
        .highlight-antique {
            background: #fff7ed;
            border: 1px solid #ffedd5;
            color: #9a3412;
        }
        .highlight-prugio {
            background: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #166534;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .spec-box {
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            padding: 10px 12px;
        }
        .spec-box .label {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .spec-box .val {
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 12px;
            padding: 12px;
        }
        .control-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 700;
            color: #334155;
        }

        .slider-input {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            accent-color: #ea580c;
        }

        .feature-card {
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 14px;
            padding: 14px;
        }
        .feature-title {
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .feature-desc {
            font-size: 11px;
            color: #64748b;
            line-height: 1.45;
        }

        /* Bottom Turntable Scrubber & Filmstrip Carousel */
        .carousel-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 444px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .scrubber-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 10px;
        }
        .scrubber-row span {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            white-space: nowrap;
        }

        .filmstrip-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scroll-behavior: smooth;
        }
        .filmstrip-scroll::-webkit-scrollbar {
            height: 5px;
        }
        .filmstrip-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }

        .thumb-card {
            flex: 0 0 68px;
            height: 84px;
            border-radius: 10px;
            border: 2px solid transparent;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: #1e293b;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .thumb-card:hover {
            transform: translateY(-2px);
            border-color: rgba(234, 88, 12, 0.6);
        }
        .thumb-card.active {
            border-color: #ea580c;
            box-shadow: 0 0 14px rgba(234, 88, 12, 0.6);
            transform: scale(1.04);
        }
        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumb-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            font-size: 9px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            padding: 2px 0;
        }

        /* Bottom Controls Bar for Mesh/Prugio */
        .bottom-prugio-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 16px;
            display: flex;
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .ctrl-btn {
            background: transparent;
            border: 1px solid #e2e8f0;
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .ctrl-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }
        .ctrl-btn.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
    </style>
    <!-- Three.js & OrbitControls & GLTFLoader & Tween.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
    <!-- Top Left Header Navigation -->
    <div class="header-bar">
        <div class="model-switcher">
            <button class="model-pill active-antique" id="pill-antique-25d" onclick="switchMainTab('antique_25d')">
                🏺 360° 실사 3D 턴테이블
            </button>
            <button class="model-pill" id="pill-antique-3d" onclick="switchMainTab('antique_3d')">
                📦 로얄둘튼 3D 메시
            </button>
            <button class="model-pill" id="pill-prugio" onclick="switchMainTab('prugio')">
                🏡 위례 37평 아파트
            </button>
        </div>
        <div class="header-title">
            <h1 id="header-main-title">라벨르지안 앤틱 명품관 360° 실사 3D 턴테이블</h1>
            <p id="header-sub-text">100% 무손실 4K 실물 사진 + Depth-Anything-V2 3D 뎁스 셰이더</p>
        </div>
    </div>

    <!-- Category Filter Bar -->
    <div class="category-bar" id="category-bar">
        <!-- Dynamically populated -->
    </div>

    <!-- Antique Item Selector Bar -->
    <div class="items-bar" id="items-bar">
        <!-- Dynamically populated -->
    </div>

    <!-- Top Center Render Mode Bar -->
    <div class="top-center-bar" id="center-mode-bar">
        <button class="mode-btn active" id="btn-mode-photo" onclick="setHoloRenderMode('photo')">✨ 실사 3D 턴테이블</button>
        <button class="mode-btn" id="btn-mode-depth" onclick="setHoloRenderMode('depth')">🗺️ 3D 뎁스 맵</button>
        <button class="mode-btn" id="btn-mode-normal" onclick="setHoloRenderMode('normal')">🧭 3D 노멀 맵</button>
        <button class="mode-btn" id="btn-mode-clay" onclick="setHoloRenderMode('clay')">🏛️ 클레이 조각 뷰</button>
    </div>

    <!-- Drag Guide Hint -->
    <div class="drag-guide-hint" id="drag-hint">
        <span>🔄 <strong>마우스 좌우 드래그</strong>로 360° 자유 회전 / <strong>휠 스크롤</strong>로 줌인</span>
    </div>

    <!-- 3D Canvas -->
    <canvas id="viewport"></canvas>

    <!-- Bottom Turntable Scrubber & Filmstrip Carousel -->
    <div class="carousel-container" id="carousel-bar">
        <div class="carousel-header">
            <span>🔄 <strong>360° 턴테이블 앵글 스크러버</strong> (마우스 드래그 또는 슬라이더로 연속 회전)</span>
            <span id="current-photo-info" style="color: #ea580c; font-weight: 800;">각도 로딩중...</span>
        </div>
        <div class="scrubber-row">
            <span>0°</span>
            <input type="range" class="slider-input" id="angle-scrubber" min="0" max="100" step="0.1" value="0" oninput="onScrubberInput(this.value)">
            <span>360°</span>
            <button class="ctrl-btn" id="btn-auto-spin" onclick="toggleAutoSpin()" style="padding: 4px 10px; font-size: 11px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
                <span id="auto-spin-icon">▶️</span> 360° 자동회전
            </button>
        </div>
        <div class="filmstrip-scroll" id="filmstrip-list">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Bottom Controls Bar (Active in Prugio / 3D Mesh Mode) -->
    <div class="bottom-prugio-bar" id="bottom-prugio-bar" style="display: none;">
        <button class="ctrl-btn active" id="light-studio" onclick="setLightingPreset('studio')">💡 스튜디오</button>
        <button class="ctrl-btn" id="light-warm" onclick="setLightingPreset('warm')">🕯️ 갤러리 웜</button>
        <button class="ctrl-btn" id="light-rim" onclick="setLightingPreset('rim')">✨ 드라마틱 림</button>
        <div style="width: 1px; height: 18px; background: #e2e8f0; margin: 0 4px;"></div>
        <button class="ctrl-btn" onclick="resetCurrentCamera()">🔄 시점 리셋</button>
    </div>

    <!-- Right Inspector Panel -->
    <div class="info-panel" id="inspector-panel">
        <!-- Content dynamic -->
    </div>

                    } else if (uRenderMode == 3) {
                        vec3 clay = vec3(0.85, 0.82, 0.80);
                        finalColor = clay * (NdotL * 0.6 + 0.4) + vec3(1.0) * spec * 1.5;
                    }

                    gl_FragColor = vec4(finalColor, colorTex.a > 0.0 ? colorTex.a : 1.0);
                }
            `
        };

        function create2DHoloMesh() {
            const geom = new THREE.PlaneGeometry(1.6, 2.13, 512, 512);
            
            holoMaterial = new THREE.ShaderMaterial({
                uniforms: THREE.UniformsUtils.clone(HoloShader.uniforms),
                vertexShader: HoloShader.vertexShader,
                fragmentShader: HoloShader.fragmentShader,
                transparent: true,
                side: THREE.DoubleSide
            });

            holoMesh = new THREE.Mesh(geom, holoMaterial);
            holoMesh.position.set(0, 0, 0);
            scene.add(holoMesh);
            
            renderCategoryBar();
            renderItemsBar();
            loadCollection(currentCollectionId, 0);
        }

        function preloadCollectionTextures(col) {
            if (!col || !col.photos) return;
            col.photos.forEach(p => {
                if (!textureCache[p.rgba]) {
                    texLoader.load(p.rgba, (t) => {
                        t.encoding = THREE.sRGBEncoding;
                        textureCache[p.rgba] = t;
                    });
                }
                if (!textureCache[p.depth]) {
                    texLoader.load(p.depth, (t) => { textureCache[p.depth] = t; });
                }
                if (!textureCache[p.normal]) {
                    texLoader.load(p.normal, (t) => { textureCache[p.normal] = t; });
                }
            });
        }

        function renderCategoryBar() {
            const bar = document.getElementById('category-bar');
            bar.innerHTML = '';

            categoriesData.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-pill ${cat.id === currentCategory ? 'active' : ''}`;
                btn.innerHTML = `${cat.name}`;
                btn.onclick = () => {
                    currentCategory = cat.id;
                    renderCategoryBar();
                    renderItemsBar();
                    
                    const filtered = Object.values(masterCollections).filter(c => currentCategory === 'all' || c.category === currentCategory);
                    if (filtered.length > 0) {
                        loadCollection(filtered[0].id, 0);
                    }
                };
                bar.appendChild(btn);
            });
        }

        function renderItemsBar() {
            const bar = document.getElementById('items-bar');
            bar.innerHTML = '';

            const filtered = Object.values(masterCollections).filter(c => currentCategory === 'all' || c.category === currentCategory);

            filtered.forEach(col => {
                const btn = document.createElement('button');
                btn.className = `col-pill ${col.id === currentCollectionId ? 'active' : ''}`;
                btn.innerHTML = `<span>${col.flag}</span> ${col.title_ko.split('(')[0].slice(0, 22)}...`;
                btn.title = col.title_ko;
                btn.onclick = () => loadCollection(col.id, 0);
                bar.appendChild(btn);
            });
        }

        function loadCollection(colId, startPhotoIdx = 0) {
            currentCollectionId = colId;
            currentPhotoIndex = startPhotoIdx;
            continuousAngle = startPhotoIdx;
            const col = masterCollections[colId];
            if (!col) return;

            preloadCollectionTextures(col);
            renderItemsBar();
            initFilmstrip();
            loadPhoto25D(startPhotoIdx);
            
            // Reset scrubber
            document.getElementById('angle-scrubber').value = (startPhotoIdx / Math.max(1, col.photos.length - 1)) * 100;
        }

        function loadPhoto25D(idx) {
            currentPhotoIndex = idx;
            const col = masterCollections[currentCollectionId];
            if (!col || !col.photos || col.photos.length === 0) return;

            const photo = col.photos[idx];
            
            if (textureCache[photo.rgba]) {
                holoMaterial.uniforms.uColor.value = textureCache[photo.rgba];
            } else {
                texLoader.load(photo.rgba, (cTex) => {
                    cTex.encoding = THREE.sRGBEncoding;
                    textureCache[photo.rgba] = cTex;
                    holoMaterial.uniforms.uColor.value = cTex;
                });
            }

            if (textureCache[photo.depth]) {
                holoMaterial.uniforms.uDepth.value = textureCache[photo.depth];
            } else {
                texLoader.load(photo.depth, (dTex) => {
                    textureCache[photo.depth] = dTex;
                    holoMaterial.uniforms.uDepth.value = dTex;
                });
            }

            if (textureCache[photo.normal]) {
                holoMaterial.uniforms.uNormal.value = textureCache[photo.normal];
            } else {
                texLoader.load(photo.normal, (nTex) => {
                    textureCache[photo.normal] = nTex;
                    holoMaterial.uniforms.uNormal.value = nTex;
                });
            }

            document.getElementById('current-photo-info').innerText = `${idx + 1} / ${col.photos.length}: ${photo.name}`;
            updateCarouselActiveState(idx);
            renderInspectorUI();
        }

        function onScrubberInput(val) {
            const col = masterCollections[currentCollectionId];
            if (!col || !col.photos) return;
            const targetIdx = Math.min(col.photos.length - 1, Math.floor((val / 100) * col.photos.length));
            if (targetIdx !== currentPhotoIndex) {
                loadPhoto25D(targetIdx);
            }
        }

                btn.style.borderColor = '#ea580c';

                btn.style.background = 'rgba(255,255,255,0.1)';
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                icon.innerText = '▶️';

        function setHoloRenderMode(mode) {

            document.querySelectorAll('#center-mode-bar .mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-mode-${mode}`).classList.add('active');

            if (holoMaterial) {
                const modeMap = { 'photo': 0, 'depth': 1, 'normal': 2, 'clay': 3 };
                holoMaterial.uniforms.uRenderMode.value = modeMap[mode];
            }
        }

        /* === 360 INTERACTIVE DRAG TO ROTATE === */
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let dragAccumulator = 0;

        canvas.addEventListener('mousedown', (e) => {
            if (currentTab !== 'antique_25d') return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            autoSpin = false;
            document.getElementById('btn-auto-spin').style.background = 'rgba(255,255,255,0.1)';
            document.getElementById('auto-spin-icon').innerText = '▶️';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (currentTab === 'antique_25d' && isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                dragAccumulator += deltaX * 0.08;
                const col = masterCollections[currentCollectionId];
                if (col && col.photos && col.photos.length > 0) {
                    const count = col.photos.length;
                    let nextIdx = (currentPhotoIndex - Math.round(dragAccumulator) % count + count) % count;
                    if (nextIdx !== currentPhotoIndex) {
                        loadPhoto25D(nextIdx);
                        dragAccumulator = 0;
                        document.getElementById('angle-scrubber').value = (nextIdx / (count - 1)) * 100;
                    }
                }

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }

            mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // Touch support for mobile
        canvas.addEventListener('touchstart', (e) => {
            if (currentTab !== 'antique_25d') return;
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (currentTab === 'antique_25d' && isDragging && e.touches.length > 0) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                dragAccumulator += deltaX * 0.08;
                const col = masterCollections[currentCollectionId];
                if (col && col.photos && col.photos.length > 0) {
                    const count = col.photos.length;
                    let nextIdx = (currentPhotoIndex - Math.round(dragAccumulator) % count + count) % count;
                    if (nextIdx !== currentPhotoIndex) {
                        loadPhoto25D(nextIdx);
                        dragAccumulator = 0;
                        document.getElementById('angle-scrubber').value = (nextIdx / (count - 1)) * 100;
                    }

                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };

        canvas.addEventListener('wheel', (e) => {

        function buildPrugioProceduralApartment() {
            const matWall = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            const matFloor = new THREE.MeshStandardMaterial({ color: 0xc89d6c, roughness: 0.35 });

            const floor = new THREE.Mesh(new THREE.BoxGeometry(13.4, 0.2, 10.2), matFloor);
            floor.position.set(0, -0.1, 0);
            prugioGroup.add(floor);

            function addWall(x, z, w, d, h=1.4) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matWall);
                wall.position.set(x, h/2, z);
                prugioGroup.add(wall);
            }

            addWall(0, 5.1, 13.4, 0.25);
            addWall(0, -5.1, 13.4, 0.25);
            addWall(-6.7, 0, 0.25, 10.2);
            addWall(6.7, 0, 0.25, 10.2);

            addWall(-2.2, 0.5, 0.2, 9.0);
            addWall(1.8, -1.8, 0.2, 6.4);
            addWall(1.8, 2.5, 0.2, 5.0);

            addWall(-4.4, 0.5, 4.4, 0.2);
            addWall(4.2, 0.5, 4.8, 0.2);

            prugioGroup.visible = false;
        }
        buildPrugioProceduralApartment();

        /* === ANIMATION & RENDER LOOP === */
        let clock = new THREE.Clock();
        let autoSpinTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            mouse.x += (mouse.targetX - mouse.x) * 0.08;
            mouse.y += (mouse.targetY - mouse.y) * 0.08;

            if (currentTab === 'antique_25d' && holoMesh && holoMaterial) {
                // Auto spin
                if (autoSpin) {
                    autoSpinTimer += delta;
                    if (autoSpinTimer > 0.35) {
                        autoSpinTimer = 0;
                        const col = masterCollections[currentCollectionId];
                        if (col && col.photos && col.photos.length > 0) {
                            const nextIdx = (currentPhotoIndex + 1) % col.photos.length;
                            loadPhoto25D(nextIdx);
                            document.getElementById('angle-scrubber').value = (nextIdx / (col.photos.length - 1)) * 100;
                        }
                    }
                }

                let effX = mouse.x;
                let effY = mouse.y;

                if (autoBreathe) {
                    effX += Math.sin(time * 0.9) * 0.25;
                    effY += Math.cos(time * 1.2) * 0.15;
                }

                holoMesh.rotation.y = effX * 0.20;
                holoMesh.rotation.x = -effY * 0.15;

                holoMaterial.uniforms.uMouseOffset.value.set(effX, effY);
                holoMaterial.uniforms.uLightPos.value.set(effX * 2.0, effY * 2.0 + 0.5, 2.0);
            } else if (controls.enabled) {
                controls.update();
            }

            renderer.render(scene, camera);
        }

        /* === INIT === */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        create2DHoloMesh();
        animate();
    </script>
</body>
</html>
