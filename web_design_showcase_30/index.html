<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏛️ Design Vault 300 - World's Best Web Design & Interaction Masterpieces</title>
  <!-- Google Fonts: Cinzel, Fira Code & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/vault.css">
</head>
<body>

<canvas id="heroCanvas"></canvas>

<div class="vault-app">
  <!-- Hero Section -->
  <header class="vault-hero">
    <div class="hero-badge">
      <span>✨</span> Awwwards & GitHub Trending 300 Master Index
    </div>
    <h1 class="hero-title">Grand Web Design Vault 300</h1>
    <p class="hero-subtitle">
      전 세계 최고의 웹 디자인, 3D WebGL 시네마틱 인터랙션 및 중세 고전 앤틱 300선의 <strong>실시간 라이브 비주얼</strong>을 바로 보고 코드를 복사하세요.
    </p>

    <!-- Stats Bar -->
    <div class="hero-stats">
      <div class="stat-item">
        <div class="stat-num" id="totalItemsCount">300</div>
        <div class="stat-label">Total Curated Designs</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" style="color: #d4af37;">40+</div>
        <div class="stat-label">Medieval & Gothic Classics</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" style="color: #10b981;">100%</div>
        <div class="stat-label">Real-time Visual Preview</div>
      </div>
    </div>
  </header>

  <!-- Control & Filter Bar -->
  <section class="control-bar">
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="search-icon-svg">🔍</span>
        <input type="text" id="searchInput" placeholder="300개 디자인 검색 (예: 마도서, WebGL, 3D, Bento, Glass, Shader...)">
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="stars">⭐ GitHub Star 인기순</option>
        <option value="title">🔤 알파벳 이름순</option>
        <option value="id">🔢 등록 순서순</option>
      </select>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="category-tab active" data-cat="all">🌐 전체 300선</button>
      <button class="category-tab" data-cat="medieval">👑 중세 고전 & 앤틱 (40)</button>
      <button class="category-tab" data-cat="webgl">🌌 Awwwards 3D WebGL (45)</button>
      <button class="category-tab" data-cat="linear">⚡ Linear 모던 다크 (45)</button>
      <button class="category-tab" data-cat="glass">🔮 Stripe 네온 글래스 (40)</button>
      <button class="category-tab" data-cat="cyberpunk">🤖 Cyberpunk HUD (35)</button>
      <button class="category-tab" data-cat="typography">✍️ 키네틱 타이포 (35)</button>
      <button class="category-tab" data-cat="datafx">📊 데이터 & 오디오 (30)</button>
      <button class="category-tab" data-cat="components">💎 실무 UI 킷 (30)</button>
    </div>
  </section>

  <!-- Grid Display -->
  <main class="vault-grid" id="vaultGrid">
    <!-- Rendered dynamically with live visual stages -->
  </main>

  <!-- Pagination -->
  <nav class="pagination-bar">
    <button class="page-btn" id="prevPageBtn">◀ 이전 페이지</button>
    <span class="page-info" id="pageInfoText">Page 1 / 13</span>
    <button class="page-btn" id="nextPageBtn">다음 페이지 ▶</button>
  </nav>
</div>

<!-- Modal Popup -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle" style="font-size: 1.25rem; font-weight: 800;">Design Detail</h3>
      <button style="background: transparent; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;" onclick="closeDetailModal()">✕</button>
    </div>

    <!-- Modal Tabs -->
    <div class="modal-tabs">
      <button class="modal-tab-btn active" id="btnTabLive" onclick="switchModalTab('live')">👀 실시간 라이브 뷰어 (Live Stage)</button>
      <button class="modal-tab-btn" id="btnTabCode" onclick="switchModalTab('code')">💻 소스코드 (HTML / CSS)</button>
    </div>

    <div class="modal-content-scroll">
      <p id="modalDesc" style="color: var(--text-body); margin-bottom: 16px;"></p>
      <div style="margin-bottom: 12px; font-weight: 700; color: var(--primary);" id="modalRepo"></div>

      <!-- Live Stage Tab -->
      <div id="modalTabLive" style="margin-bottom: 16px;">
        <div id="modalLiveStage" style="width:100%; border:1px solid var(--border); border-radius:12px; overflow:hidden;"></div>
      </div>

      <!-- Code Tab -->
      <div id="modalTabCode" style="display:none;">
        <pre class="code-viewer"><code id="modalCode"></code></pre>
      </div>
    </div>
    
    <div style="padding: 16px 28px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px;">
      <button class="btn-open" onclick="copyCurrentCode()">📋 원본 코드 복사 (Copy)</button>
      <button class="btn-open" style="background: rgba(255,255,255,0.1); color: #fff; border-color: var(--border);" onclick="closeDetailModal()">닫기</button>
    </div>
  </div>
</div>

<div class="vault-toast" id="vaultToast">✨ 알림 메시지</div>

<!-- Scripts -->
<script src="js/database_300.js"></script>
<script src="js/interactive_widgets.js"></script>
<script src="js/preview_engine.js"></script>
<script src="js/vault.js"></script>
</body>
</html>
